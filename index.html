.howto{pointer-events:auto;align-self:center;margin-top:2px;padding:6px 16px;min-height:40px;border:2px solid #e2a35a;border-radius:999px;background:transparent;color:#8a5a3a;font:800 15px "Baloo 2",sans-serif;cursor:pointer}

.mdempty[hidden]{display:none}
.md input[type=range]{width:220px;accent-color:#d6336c}

.firebtn{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:calc(28px + env(safe-area-inset-bottom));z-index:6;width:76px;height:76px;border-radius:50%;border:0;padding:5px;cursor:pointer;touch-action:none;background:conic-gradient(#ff7a00 var(--p,0%),rgba(60,30,10,.35) 0);box-shadow:0 6px 18px rgba(0,0,0,.3)}

.mbtn.cardbtn{align-self:center;margin:4px auto 2px;background:#7c5cff;border-color:#7c5cff;color:#fff;padding:4px 16px}

<body>
<canvas id="c" aria-label="Juego Corre, Chato"></canvas>

<script>
{
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
